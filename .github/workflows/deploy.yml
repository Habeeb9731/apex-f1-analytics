# Deploys to the Hetzner VPS on every push to main.
# The DEPLOY_SSH_KEY is pinned on the server to a forced command (/usr/local/bin/apex-deploy),
# so it can only trigger a pull + rebuild of /opt/apex — it cannot open a shell.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and rebuild on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST"

      - name: Check public site
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://apex.abdulhabeeb.com/)
            [ "$code" = 200 ] && echo "Live: HTTP $code" && exit 0
            sleep 5
          done
          echo "Site did not return 200 (last: $code)" && exit 1
