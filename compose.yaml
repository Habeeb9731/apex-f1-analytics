# Production deployment on the Hetzner VPS.
# Bound to loopback only: public traffic reaches it through the Cloudflare Tunnel
# (apex.abdulhabeeb.com -> http://localhost:3001). No ports are opened on the host.
services:
  apex:
    build: .
    container_name: apex
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      SQLITE_PATH: /data/apex.sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - apex_data:/data

volumes:
  apex_data:
